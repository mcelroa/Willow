name: CI

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

jobs:
   test:
      name: .NET Tests
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - name: Setup .NET
           uses: actions/setup-dotnet@v4
           with:
              dotnet-version: "10.0.x"

         - name: Restore
           run: dotnet restore

         - name: Build
           run: dotnet build --no-restore --configuration Release

         - name: Test
           run: dotnet test --no-build --configuration Release --verbosity normal

   build-client:
      name: Frontend Build + Test
      runs-on: ubuntu-latest
      defaults:
         run:
            working-directory: client
      steps:
         - uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: "22"
              cache: "npm"
              cache-dependency-path: client/package-lock.json

         - name: Install
           run: npm install

         - name: Test
           run: npm run test:run

         - name: Build
           run: npm run build
           env:
              VITE_API_URL: http://localhost:8080

   deploy-api:
      name: Deploy API to Azure App Service
      runs-on: ubuntu-latest
      needs: [test, build-client]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
         - uses: actions/checkout@v4

         - name: Log in to Docker Hub
           uses: docker/login-action@v3
           with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

         - name: Build and push Docker image
           uses: docker/build-push-action@v5
           with:
              context: .
              push: true
              tags: gillarua/willow-api:latest

         - name: Deploy to Azure App Service
           uses: azure/webapps-deploy@v3
           with:
              app-name: willow-api
              publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
              images: gillarua/willow-api:latest

   deploy-client:
      name: Deploy Client to Azure Static Web Apps
      runs-on: ubuntu-latest
      needs: [test, build-client]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
         - uses: actions/checkout@v4

         - name: Deploy to Azure Static Web Apps
           uses: Azure/static-web-apps-deploy@v1
           with:
              azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_BUSH_0C60FD403 }}
              repo_token: ${{ secrets.GITHUB_TOKEN }}
              action: "upload"
              app_location: "./client"
              api_location: ""
              output_location: "dist"
           env:
              VITE_API_URL: https://willow-api.azurewebsites.net/api
